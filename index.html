<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30 phrases d’anglais à connaître | Anglais avec Judico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--mute:#5b6577;--line:#dde2ec;--acc:#2f5bea;--accink:#fff;--soft:#e8eeff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1626;--card:#18223a;--ink:#eef2fb;--mute:#a3adc2;--line:#2a3654;--acc:#7b9bff;--accink:#0f1626;--soft:#222f52}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lexend,system-ui,sans-serif;line-height:1.5;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 48px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;gap:12px}
.brand{font-weight:800;font-size:1rem}
a.btn,button.btn{background:var(--acc);color:var(--accink);border:0;border-radius:999px;padding:10px 18px;font:600 .9rem Lexend,sans-serif;text-decoration:none;cursor:pointer;display:inline-block}
h1{font-size:clamp(1.9rem,6vw,2.8rem);line-height:1.1;margin:18px 0 6px;font-weight:800;max-width:14ch}
.sub{color:var(--mute);margin:0 0 20px}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--mute);padding:8px 14px;font:600 .85rem Lexend,sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--accink)}
ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .2s}
li.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--soft)}
.row{display:flex;align-items:center;gap:12px}
.play{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);color:var(--acc);font-size:1rem;cursor:pointer}
.txt{flex:1;text-align:left;background:none;border:0;color:var(--ink);font:600 1.05rem/1.35 Lexend,sans-serif;cursor:pointer;padding:6px 0}
.more{display:none;margin:8px 0 2px 56px;color:var(--mute);font-size:.95rem}
.more b{color:var(--ink)}
li.open .more{display:block}
.slow{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 12px;font:600 .8rem Lexend,sans-serif;cursor:pointer;margin-top:6px}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.cta{margin-top:30px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center}
.cta p{margin:0 0 14px}
[hidden]{display:none!important}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:22px}
.qbox h2{margin:0 0 4px;font-size:1.2rem}
.qn{color:var(--mute);font-size:.85rem;margin:0 0 10px}
.qq{font-size:1.25rem;font-weight:600;margin:0 0 16px;line-height:1.35}
.qrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn2{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:10px 16px;font:600 .9rem Lexend,sans-serif;cursor:pointer}
.heard{margin:12px 0 0;color:var(--mute)}
.score{font-size:2.6rem;font-weight:800;margin:6px 0}
.miss{border-top:1px solid var(--line);padding:12px 0;color:var(--mute)}
.miss b{display:block;color:var(--ink);font-size:1.05rem}
mark{background:var(--soft);color:var(--ink);border-radius:4px;padding:0 3px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,48,37,.5)}100%{box-shadow:0 0 0 18px rgba(217,48,37,0)}}
.mic{padding:16px 24px;font-size:1rem;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mic.hold{background:#d93025;color:#fff;animation:pulse 1s infinite}
@media (prefers-reduced-motion:reduce){.mic.hold{animation:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="brand">Anglais avec Judico</span>
  <a class="btn" id="subTop" target="_blank" rel="noopener"></a>
</header>
<h1 id="h1"></h1>
<p class="sub" id="sub"></p>
<div class="bar">
  <div class="seg" role="group" aria-label="Langue"><button data-l="fr" aria-pressed="true">FR</button><button data-l="en" aria-pressed="false">EN</button></div>
  <div class="seg" role="group" aria-label="Accent"><button data-a="en-GB" aria-pressed="true">UK</button><button data-a="en-US" aria-pressed="false">US</button></div>
  <button class="btn" id="all"></button>
  <button class="btn" id="testBtn"></button>
</div>
<section class="qbox" id="quiz" hidden></section>
<ol id="list"></ol>
<section class="cta">
  <p id="ctaTxt"></p>
  <a class="btn" id="subBot" target="_blank" rel="noopener"></a>
</section>
</div>
<script>
/* ===== À MODIFIER CHAQUE SEMAINE ===== */
const WEEK = 1;
const CHANNEL = "https://www.youtube.com/@judico905?sub_confirmation=1";
const AUDIO_BASE = "";  // ex : "audio/" pour lire audio/01.mp3 … audio/30.mp3 (vide = voix du navigateur)
const FULL_AUDIO = "";  // ex : "audio/all.mp3" (vide = lecture enchaînée des 30 phrases)
// [anglais, traduction, note FR, note EN]
const S = [
["How’s it going?","Ça va ?","Salutation informelle. Réponse courante : « Good, you? »","Informal greeting. Common reply: “Good, you?”"],
["Nice to meet you.","Enchanté(e).","À dire à la première rencontre.","Said when you meet someone for the first time."],
["Could you repeat that, please?","Pouvez-vous répéter, s’il vous plaît ?","« Could you » est plus poli que « Can you ».","“Could you” is more polite than “Can you”."],
["I didn’t catch that.","Je n’ai pas saisi ce que tu as dit.","« Catch » = comprendre à l’oral. Très naturel.","“Catch” means to hear and understand. Very natural."],
["Could you speak more slowly?","Peux-tu parler plus lentement ?","On dit aussi « Could you slow down? »","You can also say “Could you slow down?”"],
["What does this mean?","Qu’est-ce que ça veut dire ?","Pour demander le sens d’un mot ou d’une phrase.","To ask the meaning of a word or sentence."],
["How do you say this in English?","Comment dit-on ça en anglais ?","Utile quand il te manque un mot.","Useful when you are missing a word."],
["I’m not sure.","Je ne suis pas sûr(e).","Exprime un doute sans bloquer la conversation.","Shows doubt without stopping the conversation."],
["I’m learning English.","J’apprends l’anglais.","Présent continu : l’action est en cours.","Present continuous: the action is ongoing."],
["Can I ask you something?","Je peux te demander quelque chose ?","Introduit une question en douceur.","A gentle way to introduce a question."],
["Let me think.","Laisse-moi réfléchir.","Gagne du temps sans rester silencieux.","Buys you time without staying silent."],
["That makes sense.","Ça se tient.","Veut dire « je comprends ta logique ».","Means “I understand your logic”."],
["I’m looking for…","Je cherche…","Ex : « I’m looking for a pharmacy. »","Example: “I’m looking for a pharmacy.”"],
["How much is it?","Ça coûte combien ?","Pour demander un prix.","Used to ask a price."],
["Can I have the bill, please?","L’addition, s’il vous plaît.","« Bill » en anglais britannique, « check » en américain.","“Bill” in British English, “check” in American."],
["I’d like a coffee, please.","Je voudrais un café, s’il vous plaît.","« I’d like » est plus poli que « I want ».","“I’d like” is more polite than “I want”."],
["Where is the station?","Où est la gare ?","Remplace « station » par un autre lieu.","Replace “station” with any other place."],
["I’m running late.","Je suis en retard.","Tu es en chemin et tu arrives après l’heure prévue.","You are on the way and will arrive after the planned time."],
["See you later.","À plus tard.","À dire en partant, même sans heure précise.","Said when leaving, even without a set time."],
["Take care.","Prends soin de toi.","Une façon chaleureuse de dire au revoir.","A warm way to say goodbye."],
["I’m on my way.","Je suis en route.","Pour dire que tu arrives.","To say you are coming."],
["It depends.","Ça dépend.","Ajoute « on… » pour préciser : « It depends on the price. »","Add “on…” to explain: “It depends on the price.”"],
["Actually, I disagree.","En fait, je ne suis pas d’accord.","Faux-ami : « actually » = « en fait », pas « actuellement ».","False friend: “actually” means “en fait”, not “actuellement”."],
["I’m used to it.","J’y suis habitué(e).","« Be used to + nom » = être habitué. Différent de « I used to ».","“Be used to + noun” = be accustomed. Different from “I used to”."],
["I’m looking forward to it.","J’ai hâte.","Après « to », mets un nom ou un verbe en -ing.","After “to”, use a noun or a verb in -ing."],
["Never mind.","Laisse tomber.","Pour dire que ce n’est pas important.","Means it is not important."],
["I’m fed up.","J’en ai marre.","Familier. Tu peux ajouter « with » : « fed up with this ».","Informal. You can add “with”: “fed up with this”."],
["No worries.","Pas de souci.","Réponse courante après « Thanks » ou « Sorry ».","A common reply after “Thanks” or “Sorry”."],
["I’ll get back to you.","Je reviens vers toi.","Très utilisé au travail pour promettre une réponse.","Very common at work to promise an answer."],
["Thanks a lot, it really helps.","Merci beaucoup, ça m’aide vraiment.","« Really » renforce le sens et sonne sincère.","“Really” adds emphasis and sounds sincere."]
];
/* ===== FIN ===== */
const T={fr:{h1:"30 phrases à connaître",sub:n=>"Semaine "+n+" · Clique sur une phrase pour l’explication",all:"▶ Tout écouter",test:"🎤 Passer le test",qTitle:"Test oral",rec:"🎤 Maintiens pour parler",release:"Relâche pour terminer",hold:"Maintiens le bouton pendant que tu parles, puis relâche.",errMic:"Autorise le micro dans ton navigateur, puis réessaie.",noVoice:"Voix indisponible sur ce navigateur",listening:"Je t’écoute…",skip:"Passer",next:"Suivant",heard:"L’appareil a compris :",perfect:"Parfait, aucune erreur !",missedTitle:"À revoir :",said:"Tu as dit :",again:"Refaire le test",close:"Fermer",nosup:"Le test oral ne marche pas sur ce navigateur. Utilise Chrome ou Edge.",nothing:"Rien compris, réessaie.",note:"Maintiens le bouton, parle, puis relâche. Chrome envoie l’audio à Google pour le transcrire.",stop:"■ Arrêter",slow:"🐢 Plus lent",sub1:"S’abonner",cta:"Une nouvelle liste chaque semaine. Abonne-toi pour ne rien rater et pose tes questions en commentaire.",sub2:"S’abonner sur YouTube"},
en:{h1:"30 phrases to know",sub:n=>"Week "+n+" · Tap a sentence for the explanation",all:"▶ Play all",test:"🎤 Take the test",qTitle:"Speaking test",rec:"🎤 Hold to speak",release:"Release to finish",hold:"Hold the button while you speak, then release.",errMic:"Allow the microphone in your browser, then try again.",noVoice:"Voice unavailable in this browser",listening:"Listening…",skip:"Skip",next:"Next",heard:"The device understood:",perfect:"Perfect, no mistakes!",missedTitle:"To review:",said:"You said:",again:"Retake the test",close:"Close",nosup:"The speaking test does not work in this browser. Use Chrome or Edge.",nothing:"Nothing understood, try again.",note:"Hold the button, speak, then release. Chrome sends the audio to Google to transcribe it.",stop:"■ Stop",slow:"🐢 Slower",sub1:"Subscribe",cta:"A new list every week. Subscribe so you never miss one, and ask your questions in the comments.",sub2:"Subscribe on YouTube"}};
const TTS=("speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined")?window.speechSynthesis:null;
let lang="fr",acc="en-GB",playing=false,cur=null;
const $=id=>document.getElementById(id),list=$("list");
function pad(i){return String(i+1).padStart(2,"0")}
function render(){
  const t=T[lang];document.documentElement.lang=lang;
  $("h1").textContent=t.h1;$("sub").textContent=t.sub(WEEK)+((!TTS&&!AUDIO_BASE)?" · "+t.noVoice:"");$("ctaTxt").textContent=t.cta;
  $("subTop").textContent=t.sub1;$("subTop").href=CHANNEL;$("subBot").textContent=t.sub2;$("subBot").href=CHANNEL;
  $("all").textContent=playing?t.stop:t.all;$("testBtn").textContent=t.test;
  const open=[...list.children].map(l=>l.classList.contains("open"));
  list.innerHTML="";
  S.forEach((s,i)=>{
    const li=document.createElement("li");li.id="s"+i;if(open[i])li.classList.add("open");
    li.innerHTML='<div class="row"><button class="play" aria-label="Play">▶</button><button class="txt"></button></div><div class="more"><b></b><br><span></span><br><button class="slow"></button></div>';
    li.querySelector(".txt").textContent=s[0];
    li.querySelector("b").textContent=s[1];
    li.querySelector("span").textContent=lang==="fr"?s[2]:s[3];
    li.querySelector(".slow").textContent=t.slow;
    li.querySelector(".play").onclick=()=>{halt();playItem(i,false)};
    li.querySelector(".slow").onclick=()=>{halt();playItem(i,true)};
    li.querySelector(".txt").onclick=()=>li.classList.toggle("open");
    list.appendChild(li);
  });
}
function mark(i){[...list.children].forEach((l,k)=>l.classList.toggle("on",k===i))}
function halt(){playing=false;if(TTS)TTS.cancel();if(cur){cur.pause();cur=null}mark(-1);$("all").textContent=T[lang].all}
function say(text,slow,done){
  if(!TTS){if(done)done();return}
  const u=new SpeechSynthesisUtterance(text.replace(/’/g,"'"));
  u.lang=acc;u.rate=slow?.7:.95;
  const v=TTS.getVoices().find(x=>x.lang.replace("_","-")===acc);if(v)u.voice=v;
  u.onend=done;TTS.speak(u);
}
function playItem(i,slow,done){
  mark(i);const end=()=>{mark(-1);if(done)done()};
  if(AUDIO_BASE){
    cur=new Audio(AUDIO_BASE+pad(i)+".mp3");cur.playbackRate=slow?.75:1;cur.onended=end;
    cur.onerror=()=>{cur=null;say(S[i][0],slow,end)};cur.play().catch(()=>{});
  }else say(S[i][0],slow,end);
}
function seq(i){if(!playing||i>=S.length)return halt();playItem(i,false,()=>seq(i+1))}
$("all").onclick=()=>{
  if(playing)return halt();
  playing=true;$("all").textContent=T[lang].stop;
  if(FULL_AUDIO){cur=new Audio(FULL_AUDIO);cur.onended=halt;cur.play().catch(halt)}else seq(0);
};
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.querySelectorAll("[data-l]").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{acc=b.dataset.a;document.querySelectorAll("[data-a]").forEach(x=>x.setAttribute("aria-pressed",x===b))});

/* ===== TEST ORAL : mêmes positions que la liste S (1 situation par phrase) ===== */
const Q=["you greet a friend casually","you meet someone for the first time","you politely ask someone to say it again","you did not hear what someone said","someone speaks too fast","you do not know what a word means","you forget an English word","you are not certain about an answer","someone asks what you are studying and you say you are learning English","you politely want to ask someone a question","you need a moment before answering","you understand someone’s logic","you tell someone you are searching for something","you want to know the price","you ask for the bill in a British restaurant","you order a coffee politely","you ask where the station is","you will arrive after the planned time","you leave and will see someone later","you say goodbye warmly","you tell someone you are coming","the answer is not simple","you disagree and start with the word that means “en fait”","you are accustomed to something","you are excited about something coming","something is no longer important","you are tired of a situation","someone thanks you and you say it is fine","you promise to give an answer later","you thank someone because it was useful"];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,N=10;
let qs=[],qi=0,res=[],done=false;
const quiz=$("quiz");
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!=null)x.textContent=txt;return x}
function norm(w){return w.toLowerCase().replace(/’/g,"'").replace(/\bi am\b/g,"i'm").replace(/\bi will\b/g,"i'll").replace(/\bi would\b/g,"i'd").replace(/[^a-z' ]/g," ").replace(/'/g,"").split(/\s+/).filter(Boolean)}
function grade(exp,heard){
  const e=exp.split(" ").map(w=>norm(w)[0]||""),h=norm(heard),m=e.length,n=h.length;
  const d=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=e[i-1]&&e[i-1]===h[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);
  const hit=new Set();let i=m,j=n;
  while(i>0&&j>0){if(e[i-1]&&e[i-1]===h[j-1]){hit.add(i-1);i--;j--}else if(d[i-1][j]>=d[i][j-1])i--;else j--}
  return{hit,ratio:hit.size/e.filter(Boolean).length};
}
function startQuiz(){
  halt();quiz.hidden=false;
  if(!SR){quiz.innerHTML="";quiz.append(el("p","qq",T[lang].nosup));return}
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)navigator.mediaDevices.getUserMedia({audio:true}).then(m=>m.getTracks().forEach(x=>x.stop())).catch(()=>{});
  qs=[...S.keys()].sort(()=>Math.random()-.5).slice(0,N);qi=0;res=[];showQ();quiz.scrollIntoView();
}
function showQ(){
  const t=T[lang],i=qs[qi];done=false;quiz.innerHTML="";
  const row=el("div","qrow"),mic=el("button","btn mic",t.rec),skip=el("button","btn2",t.skip),hd=el("p","heard","");
  hd.setAttribute("aria-live","polite");
  mic.oncontextmenu=e=>e.preventDefault();
  mic.addEventListener("pointerdown",ev=>startHold(mic,hd,row,i,ev));
  ["pointerup","pointercancel"].forEach(n=>mic.addEventListener(n,()=>endHold(mic)));
  mic.addEventListener("keydown",ev=>{if((ev.key===" "||ev.key==="Enter")&&!ev.repeat){ev.preventDefault();startHold(mic,hd,row,i,ev)}});
  mic.addEventListener("keyup",ev=>{if(ev.key===" "||ev.key==="Enter")endHold(mic)});
  skip.onclick=()=>{stopRec();res[qi]={heard:"",ok:false,hit:new Set()};next()};
  row.append(mic,skip);
  quiz.append(el("h2",0,t.qTitle),el("p","qn",(qi+1)+" / "+N),el("p","qq","What do you say when "+Q[i]+"?"),row,hd,el("p","qn",t.note));
}
let rec=null,heldText="",held=false,errCode="";
function stopRec(){if(rec){rec.onend=null;rec.onresult=null;rec.onerror=null;try{rec.abort()}catch(e){}rec=null}}
function resetMic(mic){held=false;mic.classList.remove("hold");mic.textContent=T[lang].rec}
function startHold(mic,hd,row,i,ev){
  if(ev.preventDefault)ev.preventDefault();
  if(held)return;
  try{if(ev.pointerId!=null)mic.setPointerCapture(ev.pointerId)}catch(e){}
  held=true;stopRec();done=false;heldText="";errCode="";
  const t=T[lang];mic.classList.add("hold");mic.textContent=t.release;hd.textContent=t.listening;
  const r=new SR();rec=r;r.lang=acc;r.interimResults=true;r.continuous=true;
  r.onresult=e=>{let txt="";for(let k=0;k<e.results.length;k++)txt+=e.results[k][0].transcript+" ";heldText=txt.trim()};
  r.onerror=e=>{errCode=e.error||""};
  r.onend=()=>{if(rec===r)finishHold(mic,hd,row,i)};
  try{r.start()}catch(e){finishHold(mic,hd,row,i)}
}
function endHold(mic){if(!held)return;resetMic(mic);if(rec){try{rec.stop()}catch(e){}}}
function finishHold(mic,hd,row,i){
  if(done)return;done=true;rec=null;resetMic(mic);
  const t=T[lang],txt=heldText;let g={hit:new Set(),ratio:0};if(txt)g=grade(S[i][0],txt);
  if(txt)res[qi]={heard:txt,ok:g.ratio>=.8,hit:g.hit};
  hd.textContent=txt?t.heard+" « "+txt+" »":(/not-allowed/.test(errCode)?t.errMic:t.hold);
  if(txt&&!row.querySelector(".nx")){const nx=el("button","btn nx",t.next);nx.onclick=next;row.prepend(nx)}
}
function next(){stopRec();qi++;if(qi<N)showQ();else showResult()}
function showResult(){
  const t=T[lang],ok=res.filter(r=>r.ok).length;quiz.innerHTML="";
  quiz.append(el("h2",0,t.qTitle),el("div","score",ok+" / "+N),el("p","qn",ok===N?t.perfect:t.missedTitle));
  qs.forEach((i,k)=>{
    const r=res[k];if(r.ok)return;
    const d=el("div","miss"),b=el("b");
    S[i][0].split(" ").forEach((w,x)=>{b.append(r.hit.has(x)?document.createTextNode(w+" "):el("mark",0,w),document.createTextNode(" "))});
    const ear=el("button","slow","▶");ear.onclick=()=>{halt();playItem(i,false)};ear.setAttribute("aria-label","Play");
    d.append(b,el("span",0,t.said+" « "+(r.heard||"…")+" »"),document.createElement("br"),el("span",0,S[i][1]+" — "+(lang==="fr"?S[i][2]:S[i][3])),document.createElement("br"),ear);
    quiz.append(d);
  });
  const row=el("div","qrow"),again=el("button","btn",t.again),cl=el("button","btn2",t.close);row.style.marginTop="16px";
  again.onclick=startQuiz;cl.onclick=()=>{quiz.hidden=true};row.append(again,cl);quiz.append(row);
}
$("testBtn").onclick=startQuiz;
render();
</script>
</body>
</html>
