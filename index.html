const TTS=("speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined")?window.speechSynthesis:null;

function say(text,slow,done){
  if(!TTS){if(done)done();return}
  const u=new SpeechSynthesisUtterance(text.replace(/’/g,"'"));
  u.lang=acc;u.rate=slow?.7:.95;
  const v=TTS.getVoices().find(x=>x.lang.replace("_","-")===acc);if(v)u.voice=v;
  u.onend=done;TTS.speak(u);
}

function grade(exp,heard){
  const e=exp.split(" ").map(w=>norm(w)[0]||""),h=norm(heard),m=e.length,n=h.length;
  const d=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=e[i-1]&&e[i-1]===h[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);

  return{hit,ratio:hit.size/e.filter(Boolean).length};
}

  mic.oncontextmenu=e=>e.preventDefault();
  mic.addEventListener("pointerdown",ev=>startHold(mic,hd,row,i,ev));
  ["pointerup","pointercancel"].forEach(n=>mic.addEventListener(n,()=>endHold(mic)));
  mic.addEventListener("keydown",ev=>{if((ev.key===" "||ev.key==="Enter")&&!ev.repeat){ev.preventDefault();startHold(mic,hd,row,i,ev)}});
  mic.addEventListener("keyup",ev=>{if(ev.key===" "||ev.key==="Enter")endHold(mic)});
  skip.onclick=()=>{stopRec();res[qi]={heard:"",ok:false,hit:new Set()};next()};
  row.append(mic,skip);
  quiz.append(el("h2",0,t.qTitle),el("p","qn",(qi+1)+" / "+N),el("p","qq","What do you say when "+Q[i]+"?"),row,hd,el("p","qn",t.note));
}
let rec=null,heldText="",held=false,errCode="";
function stopRec(){if(rec){rec.onend=null;rec.onresult=null;rec.onerror=null;try{rec.abort()}catch(e){}rec=null}}
function resetMic(mic){held=false;mic.classList.remove("hold");mic.textContent=T[lang].rec}
function startHold(mic,hd,row,i,ev){
  if(ev.preventDefault)ev.preventDefault();
  if(held)return;
  try{if(ev.pointerId!=null)mic.setPointerCapture(ev.pointerId)}catch(e){}
  held=true;stopRec();done=false;heldText="";errCode="";
  const t=T[lang];mic.classList.add("hold");mic.textContent=t.release;hd.textContent=t.listening;
  const r=new SR();rec=r;r.lang=acc;r.interimResults=true;r.continuous=true;
  r.onresult=e=>{let txt="";for(let k=0;k<e.results.length;k++)txt+=e.results[k][0].transcript+" ";heldText=txt.trim()};
  r.onerror=e=>{errCode=e.error||""};
  r.onend=()=>{if(rec===r)finishHold(mic,hd,row,i)};
  try{r.start()}catch(e){finishHold(mic,hd,row,i)}
}
function endHold(mic){if(!held)return;resetMic(mic);if(rec){try{rec.stop()}catch(e){}}}
function finishHold(mic,hd,row,i){
  if(done)return;done=true;rec=null;resetMic(mic);
  const t=T[lang],txt=heldText;let g={hit:new Set(),ratio:0};if(txt)g=grade(S[i][0],txt);
  if(txt)res[qi]={heard:txt,ok:g.ratio>=.8,hit:g.hit};
  hd.textContent=txt?t.heard+" « "+txt+" »":(/not-allowed/.test(errCode)?t.errMic:t.hold);
  if(txt&&!row.querySelector(".nx")){const nx=el("button","btn nx",t.next);nx.onclick=next;row.append(nx)}
}
function next(){stopRec();qi++;if(qi<N)showQ();else showResult()}
function showResult(){
  const t=T[lang],ok=res.filter(r=>r.ok).length;quiz.innerHTML="";
  quiz.append(el("h2",0,t.qTitle),el("div","score",ok+" / "+N),el("p","qn",ok===N?t.perfect:t.missedTitle));
  qs.forEach((i,k)=>{
    const r=res[k];if(r.ok)return;
    const d=el("div","miss"),b=el("b");
    S[i][0].split(" ").forEach((w,x)=>{b.append(r.hit.has(x)?document.createTextNode(w+" "):el("mark",0,w),document.createTextNode(" "))});
    const ear=el("button","slow","▶");ear.onclick=()=>{halt();playItem(i,false)};ear.setAttribute("aria-label","Play");
    d.append(b,el("span",0,t.said+" « "+(r.heard||"…")+" »"),document.createElement("br"),el("span",0,S[i][1]+" — "+(lang==="fr"?S[i][2]:S[i][3])),document.createElement("br"),ear);
    quiz.append(d);
  });
  if(ok>P.best){P.best=ok;save()}
  quiz.append(el("p","qn",t.best(P.best)));
  const row=el("div","qrow"),again=el("button","btn",t.again),cl=el("button","btn2",t.close);row.style.marginTop="16px";
  const sub=el("a","btn",t.subAfter);sub.href=CHANNEL;sub.target="_blank";sub.rel="noopener";
  const sh=el("button","btn2",t.share);
  sh.onclick=()=>{const msg=t.shareTxt(ok,N)+" "+location.href.split("?")[0];if(navigator.share)navigator.share({text:msg}).catch(()=>{});else window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank")};
  again.onclick=startQuiz;cl.onclick=()=>{quiz.hidden=true};row.append(sub,sh,again,cl);quiz.append(row);
}
$("testBtn").onclick=startQuiz;

/* ===== SUIVI : objectif, série, progression, bonus (sauvegardé dans le navigateur) ===== */
let P={goal:0,streak:0,last:"",t:{d:"",s:[]},w:{k:0,s:[]},best:0};
try{Object.assign(P,JSON.parse(localStorage.getItem("awj")||"{}"))}catch(e){}
function save(){try{localStorage.setItem("awj",JSON.stringify(P))}catch(e){}}
function day(d){return(d||new Date()).toLocaleDateString("sv")}
function heardIt(i){
  const d=day();if(P.t.d!==d)P.t={d:d,s:[],say:[]};if(P.w.k!==WEEK)P.w={k:WEEK,s:[]};
  if(!P.t.s.includes(i))P.t.s.push(i);if(!P.w.s.includes(i))P.w.s.push(i);
  save();renderMe();
}
function saidIt(i){
  const d=day();if(P.t.d!==d)P.t={d:d,s:[],say:[]};P.t.say=P.t.say||[];
  const k=P.t.say.indexOf(i);if(k>=0)P.t.say.splice(k,1);else P.t.say.push(i);
  if(P.goal&&P.t.say.length>=P.goal&&P.last!==d){P.streak=P.last===day(new Date(Date.now()-864e5))?P.streak+1:1;P.last=d}
  save();render();
}
function tick(){
  const c=$("clock"),t=T[lang],ms=new Date(NEXT_UPDATE)-Date.now();c.textContent="";
  if(ms<=0){c.append(el("span","t","⏱️ "+t.soon));return}
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),sec=Math.floor(ms%6e4/1e3);
  const u=lang==="fr"?["j","h","min","s"]:["d","h","m","s"],p2=n=>String(n).padStart(2,"0");
  c.append(el("small",0,t.clockLbl),el("span","w","⏱️"),el("span","t"," "+d+u[0]+" "+p2(h)+u[1]+" "+p2(m)+u[2]+" "+p2(sec)+u[3]));
}
setInterval(tick,1000);
function renderPdf(){
  const t=T[lang],b=$("pdfbox"),ok=P.shared===WEEK;b.innerHTML="";
  b.append(el("p",0,ok?t.pdfUnlocked:t.pdfLock));
  if(ok){const a=el("a","btn",t.pdfBtn);a.href=PDF_URL;a.setAttribute("download","");b.append(a)}
  else{const bt=el("button","btn",t.pdfBtn);bt.onclick=shareForPdf;b.append(bt)}
}
function shareForPdf(){
  const t=T[lang],url=location.href.split("?")[0].split("#")[0],msg=t.pdfShareTxt+" "+url;
  const unlock=()=>{P.shared=WEEK;save();renderPdf()};
  const note=m=>{let n=$("pdfmsg");if(!n){n=el("p","qn");n.id="pdfmsg";$("pdfbox").append(n)}n.textContent=m};
  const fallback=()=>{
    if(navigator.clipboard)navigator.clipboard.writeText(msg).catch(()=>{});
    const w=window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
    note(w?t.sharing:t.popup);
    let away=false;
    const cleanup=()=>{document.removeEventListener("visibilitychange",chk);window.removeEventListener("blur",blur);window.removeEventListener("focus",foc)};
    const chk=()=>{if(document.hidden)away=true;else if(away){cleanup();unlock()}};
    const blur=()=>{away=true};
    const foc=()=>{if(away){cleanup();unlock()}};
    document.addEventListener("visibilitychange",chk);window.addEventListener("blur",blur);window.addEventListener("focus",foc);
  };
  if(navigator.share){note(t.sharing);navigator.share({text:msg}).then(unlock).catch(e=>{if(!e||e.name!=="AbortError")fallback()})}
  else fallback();
}
function renderMe(){
  const t=T[lang],me=$("me"),d=day();
  const nT=P.t.d===d?(P.t.say||[]).length:0,nW=P.w.k===WEEK?P.w.s.length:0;
  const st=(P.last===d||P.last===day(new Date(Date.now()-864e5)))?P.streak:0;
  me.innerHTML="";
  const g=el("div","qrow");g.append(el("span","qn",t.goalLbl));
  [3,5,10].forEach(n=>{const b=el("button","btn2",String(n));b.setAttribute("aria-pressed",P.goal===n);b.onclick=()=>{P.goal=n;save();render()};g.append(b)});g.append(el("span","qn",t.goalAft));
  me.append(g,el("p","heard",t.todayP(nT,P.goal)+(st?"   "+t.streak(st):"")));
  const pg=el("div","pg"),bar=el("i");bar.style.width=Math.min(100,nW/S.length*100)+"%";pg.append(bar);
  me.append(pg,el("p","qn",t.weekP(nW,S.length)));
  if(P.goal){const cb=el("button","btn2",t.commentBtn);cb.onclick=()=>{const m=t.commentTxt(P.goal);
    if(navigator.clipboard)navigator.clipboard.writeText(m).then(()=>{cb.textContent=t.copied},()=>{cb.textContent=m});else cb.textContent=m;
    window.open(COMMENT_URL,"_blank")};me.append(cb)}
  const bn=el("div","miss");bn.append(el("b",0,t.bonus));
  if(nW>=BONUS_UNLOCK){
    const q=el("p",0,BONUS[0]);q.style.cssText="font-weight:600;color:var(--ink);margin:6px 0";
    const pl=el("button","slow","▶");pl.onclick=()=>{halt();say(BONUS[0],false)};
    bn.append(q,el("span",0,BONUS[1]+" — "+(lang==="fr"?BONUS[2]:BONUS[3])),document.createElement("br"),pl);
  }else bn.append(el("span",0,t.lock(BONUS_UNLOCK-nW)));
  me.append(bn);tick();
}
render();
</script>
