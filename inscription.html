<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Inscription | Anglais avec Judico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1526;--card:#16213a;--ink:#f2f5fb;--mute:#a9b4cb;--line:#2b3858;--acc:#f0a921;--accink:#1a1405;--err:#ff8a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lexend,system-ui,sans-serif;line-height:1.5;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:1040px;margin:0 auto;padding:20px 18px 56px;display:grid;gap:22px}
@media (min-width:900px){.wrap{grid-template-columns:1.1fr 1fr;gap:36px;align-items:start;padding-top:48px}.slider{position:sticky;top:24px}}
.slider{position:relative;overflow:hidden;border-radius:18px;aspect-ratio:16/9;background:#000;touch-action:pan-y}
.track{display:flex;height:100%;transition:transform .7s ease}
.track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;display:block}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:8px}
.dots button{width:12px;height:12px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.5);cursor:pointer}
.dots button[aria-current=true]{background:var(--acc);transform:scale(1.2)}
form,.done{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
h1,h2{margin:0 0 18px;font-size:1.6rem;font-weight:800;line-height:1.15}
.fld,fieldset{display:block;border:0;margin:0 0 18px;padding:0}
.fld>span,legend{display:block;font-weight:600;margin-bottom:8px;padding:0}
input[type=text],textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;min-height:48px}
textarea{min-height:104px;resize:vertical}
input[type=text]:focus,textarea:focus{outline:3px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{position:relative}
.opts input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opts span{display:block;border:1px solid var(--line);border-radius:999px;padding:11px 18px;min-height:46px;background:var(--bg)}
.opts input:checked+span{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.opts input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
.cta{width:100%;border:0;border-radius:14px;background:var(--acc);color:var(--accink);font:800 1.05rem/1.3 Lexend,sans-serif;padding:18px 16px;cursor:pointer;margin-top:6px}
.cta:hover{filter:brightness(1.07)}
.cta:disabled{opacity:.6;cursor:wait}
.cta:focus-visible{outline:3px solid #fff;outline-offset:3px}
.note{margin:12px 0 0;color:var(--mute);font-size:.8rem;text-align:center}
.msg{margin:12px 0 0;color:var(--err);font-weight:600;min-height:1.2em}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done p{margin:0;color:var(--mute)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.track{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="slider" id="slider" role="region" aria-roledescription="carousel" aria-label="Photos">
    <div class="track" id="track">
      <img src="images/slide-1.jpg" alt="Apprendre dans un livre : ce qui ne marche pas">
      <img src="images/slide-2.jpg" alt="Écouter et répéter : ce qui marche">
      <img src="images/slide-1.jpg" alt="" aria-hidden="true">
    </div>
    <div class="dots" id="dots"></div>
  </div>

  <div>
    <form id="f" novalidate>
      <h1>Inscription</h1>
      <label class="fld"><span>Prénom</span><input type="text" name="prenom" autocomplete="given-name" required></label>
      <label class="fld"><span>WhatsApp ou e-mail</span><input type="text" name="contact" autocomplete="off" required></label>
      <label class="fld"><span>Pourquoi veux-tu parler anglais maintenant ?</span><textarea name="pourquoi" required></textarea></label>
      <label class="fld"><span>Qu’as-tu déjà essayé, et pourquoi ça n’a pas marché ?</span><textarea name="essaye" required></textarea></label>
      <fieldset>
        <legend>Peux-tu parler à voix haute au moins 10 minutes par jour pendant 3 mois ?</legend>
        <div class="opts">
          <label><input type="radio" name="dix_minutes" value="Oui" required><span>Oui</span></label>
          <label><input type="radio" name="dix_minutes" value="Non"><span>Non</span></label>
          <label><input type="radio" name="dix_minutes" value="Je ne suis pas sûr(e)"><span>Je ne suis pas sûr(e)</span></label>
        </div>
      </fieldset>
      <label class="fld"><span>Que feras-tu le jour où tu n’auras pas envie ?</span><textarea name="sans_envie" required></textarea></label>
      <fieldset>
        <legend>Peux-tu commencer lundi prochain ?</legend>
        <div class="opts">
          <label><input type="radio" name="lundi" value="Oui" required><span>Oui</span></label>
          <label><input type="radio" name="lundi" value="Non"><span>Non</span></label>
        </div>
      </fieldset>
      <div class="hp" aria-hidden="true"><input type="text" name="site" tabindex="-1" autocomplete="off"></div>
      <button class="cta" id="btn" type="submit">Je m’inscris pour parler anglais dans 3 mois</button>
      <p class="msg" id="msg" role="alert"></p>
    </form>
    <div class="done" id="done" hidden>
      <h2 id="doneT">Merci !</h2>
      <p id="doneP">Je lis toutes les candidatures et je te réponds sous 48 h.</p>
    </div>
  </div>
</main>
<script>
/* ===== À MODIFIER ===== */
const URL_SCRIPT = "COLLE_ICI_L_URL_DU_SCRIPT"; // l’URL de l’application web Google Apps Script
const INSCRIPTIONS_OUVERTES = true;               // mets false quand les 2 places sont prises
/* ===== FIN ===== */
const $ = id => document.getElementById(id);

/* Diaporama : une photo toutes les 5 secondes */
const track = $("track"), dotsBox = $("dots"), N = 2;
let i = 0, timer = null;
for (let k = 0; k < N; k++) {
  const b = document.createElement("button");
  b.type = "button"; b.setAttribute("aria-label", "Photo " + (k + 1));
  b.onclick = () => { go(k); restart(); };
  dotsBox.appendChild(b);
}
function paint() { [...dotsBox.children].forEach((b, k) => b.setAttribute("aria-current", k === i % N)); }
function go(n) { i = n; track.style.transform = "translateX(-" + n * 100 + "%)"; paint(); }
function next() { go(i + 1); }
track.addEventListener("transitionend", () => {
  if (i === N) { track.style.transition = "none"; i = 0; track.style.transform = "translateX(0)"; track.offsetWidth; track.style.transition = ""; paint(); }
});
function start() { if (!matchMedia("(prefers-reduced-motion: reduce)").matches) timer = setInterval(next, 5000); }
function stop() { clearInterval(timer); }
function restart() { stop(); start(); }
const sl = $("slider");
sl.addEventListener("mouseenter", stop); sl.addEventListener("mouseleave", restart);
sl.addEventListener("focusin", stop); sl.addEventListener("focusout", restart);
let x0 = null;
sl.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; stop(); }, { passive: true });
sl.addEventListener("touchend", e => {
  if (x0 !== null && Math.abs(e.changedTouches[0].clientX - x0) > 40) go(i % N === 0 ? 1 : 0);
  x0 = null; restart();
});
paint(); start();

/* Formulaire */
const form = $("f"), btn = $("btn"), msg = $("msg");
function fini(titre, texte) {
  form.hidden = true; $("doneT").textContent = titre; $("doneP").textContent = texte; $("done").hidden = false;
}
if (!INSCRIPTIONS_OUVERTES) fini("Les 2 places sont prises", "La prochaine session ouvre dans 3 mois.");
form.addEventListener("submit", async e => {
  e.preventDefault(); msg.textContent = "";
  if (!form.checkValidity()) { form.reportValidity(); return; }
  if (form.elements.site.value) { fini("Merci !", "Je lis toutes les candidatures et je te réponds sous 48 h."); return; }
  const label = btn.textContent; btn.disabled = true; btn.textContent = "Envoi…";
  try {
    if (URL_SCRIPT.indexOf("COLLE_ICI") === 0) throw new Error("URL du script manquante");
    await fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", body: new URLSearchParams(new FormData(form)) });
    fini("Merci !", "Je lis toutes les candidatures et je te réponds sous 48 h.");
  } catch (err) {
    console.error(err);
    msg.textContent = "L’envoi n’a pas marché. Réessaie dans un instant.";
    btn.disabled = false; btn.textContent = label;
  }
});
</script>
</body>
</html>
